steps:
  # 1. Fetch secret from Google Secret Manager with detailed logging
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "============================================================"
        echo " 🔐 [STEP 1] Fetching Secret: '${_SECRET_NAME}' from Secret Manager"
        echo "============================================================"
        
        if gcloud secrets versions access latest --secret="${_SECRET_NAME}" > .env.production 2>secret_err.log; then
          echo "✅ [SUCCESS] Secret '${_SECRET_NAME}' fetched successfully!"
          echo "📄 Loaded environment variable keys into .env.production:"
          grep -v '^#' .env.production | grep '=' | cut -d '=' -f 1 | sed 's/^/   • /'
          echo "============================================================"
        else
          echo "❌ [ERROR] Failed to fetch secret '${_SECRET_NAME}' from Secret Manager!"
          echo "-------------------- Error Output --------------------"
          cat secret_err.log
          echo "------------------------------------------------------"
          echo "💡 Debugging Steps:"
          echo " 1. Check if Secret named '${_SECRET_NAME}' exists in Secret Manager."
          echo " 2. Ensure Cloud Build Service Account has role 'Secret Manager Secret Accessor'."
          echo "============================================================"
          exit 1
        fi

  # 2. Pull existing image for Docker cache
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_IMAGE_NAME}:latest || exit 0

  # 3. Build using Docker cache and BuildKit
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--cache-from'
      - '${_IMAGE_NAME}:latest'
      - '-t'
      - '${_IMAGE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_IMAGE_NAME}:latest'
      - '.'

  # 4. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_IMAGE_NAME}']

  # 5. Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_IMAGE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '4044'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--clear-secrets'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SECRET_NAME: 'sarvam-calling-agent-env'
  _REGION: 'asia-south1'
  _SERVICE_NAME: 'devcaller'
  _IMAGE_NAME: 'asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/devcaller'

images:
  - '${_IMAGE_NAME}:${SHORT_SHA}'
  - '${_IMAGE_NAME}:latest'
